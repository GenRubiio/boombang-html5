# ./docker/nginx/default.conf
# Copied into /etc/nginx/conf.d/default.conf by client/Dockerfile, replacing stock nginx:alpine's
# own default.conf (design.md §13.1, tasks.md slice 13). Same `location /` behaviour as the
# stock file it replaces (root + index only, no SPA fallback added — out of this slice's scope);
# the one addition is the `/assets/` location below.
server {
    listen       80;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # index.html has no filename hash, so it (and the hashed asset names referenced inside
        # it) must always be revalidated against the server. Without an explicit Cache-Control
        # header, ETag/Last-Modified alone let browsers apply heuristic freshness caching
        # (RFC 7234 4.2.2) and serve a stale index.html straight from disk cache with no
        # conditional request at all — the exact mechanism that hid the AvatarLookDebugPanel
        # chunk behind a days-old cached bundle. `no-cache` keeps the existing validators useful
        # while forcing revalidation on every request.
        add_header Cache-Control "no-cache" always;
    }

    # Vite's content-hashed build output (client/vite.config.js: chunkFileNames/entryFileNames/
    # assetFileNames all include `[hash]`) — a filename only changes when its bytes do, so an
    # unchanged file costs a returning player nothing (design.md §13.1, §13.4). The root
    # index.html is deliberately NOT covered here: it has no hash and must always be
    # revalidated.
    location ^~ /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    error_page  500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
