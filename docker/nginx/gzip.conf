# ./docker/nginx/gzip.conf
# Copied into /etc/nginx/conf.d/ by client/Dockerfile (design.md §13.1, tasks.md slice 13). Before
# that copy, this file was verified dead configuration: nothing in docker-compose.yml or any
# vhost referenced it, so the client image compressed nothing. It is loaded automatically by
# stock nginx's http-context `include /etc/nginx/conf.d/*.conf;` — no explicit `include` needed.
gzip on;
gzip_comp_level 6;
gzip_min_length 256;
gzip_vary on;
gzip_proxied any;

# Tipos comunes (HTML, CSS, JS, JSON, SVG, fuentes…)
gzip_types
  text/plain
  text/css
  text/xml
  text/javascript
  application/javascript
  application/x-javascript
  application/json
  application/xml
  application/rss+xml
  application/atom+xml
  image/svg+xml
  font/ttf
  font/otf
  font/woff
  font/woff2;

# design.md §13.1 (tasks.md slice 13): serve the build-time-generated `.json.gz` siblings
# directly (client/scripts/emit-gzip-siblings.cjs, run in client/Dockerfile after `vite build`)
# instead of compressing every request on the fly — zero request-time CPU, and a better ratio
# than gzip_comp_level 6 above (the .gz sibling is written at level 9). Falls through to the
# on-the-fly `gzip on;` above for any matched type that has no sibling on disk (e.g. .css/.js).
gzip_static on;
