# Local-only reverse proxy in front of the api container.
#
# In production nginx-proxy sits in front of the API and injects the headers in
# docker/nginx/api-cors.conf. Without it, the PHP built-in server serves
# public/uploads/* as plain static files, bypassing Laravel entirely, so those
# responses carry no Access-Control-Allow-Origin header and Phaser (which loads
# images over XHR) cannot read them from the client origin.
#
# The CORS headers are scoped to /uploads/ on purpose: Laravel already emits its
# own headers for /api/* via config/cors.php, and a second copy here would make
# the browser reject the response for having multiple values.

server {
    listen 80;
    server_name _;

    client_max_body_size 300m;

    location /uploads/ {
        proxy_pass http://api:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Access-Control-Allow-Origin "$http_origin" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
        add_header Access-Control-Expose-Headers "Content-Length,Content-Range" always;
    }

    location / {
        proxy_pass http://api:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
