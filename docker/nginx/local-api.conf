# Local-only reverse proxy in front of the api container.
#
# In production nginx-proxy sits in front of the API and injects the headers in
# docker/nginx/api-cors.conf. Without it, the PHP built-in server serves
# public/uploads/* as plain static files, bypassing Laravel entirely, so those
# responses carry no Access-Control-Allow-Origin header and Phaser (which loads
# images over XHR) cannot read them from the client origin.
#
# The CORS headers are scoped to /uploads/ on purpose: Laravel already emits its
# own headers for /api/* via config/cors.php, and a second copy here would make
# the browser reject the response for having multiple values.

# Docker's embedded DNS assigns container IPs afresh on every restart, and nginx
# resolves a literal hostname in proxy_pass exactly once at startup and caches it
# forever. After an OrbStack/Docker restart the api container comes back on a new
# IP and this proxy keeps dialling the dead one, returning 502 for every
# /uploads/* asset -- the lobby still loads (it arrives over the socket) but no
# scene image does. Naming the resolver and routing proxy_pass through a variable
# forces nginx to re-resolve at request time, so a restarted api is picked up
# without restarting this container.

server {
    listen 80;
    server_name _;

    client_max_body_size 300m;

    resolver 127.0.0.11 ipv6=off valid=10s;
    set $api_upstream http://api:80;

    location /uploads/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Access-Control-Allow-Origin "$http_origin" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
        add_header Access-Control-Expose-Headers "Content-Length,Content-Range" always;
    }

    location / {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
