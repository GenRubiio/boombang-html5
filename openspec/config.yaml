strict_tdd: true
context: |
  client is a Node.js/TypeScript ESM, Vue, Node.js/TypeScript project.
  Detected markers: client/package.json, client/npm package manager, launcher/package.json, launcher/npm package manager, server/package.json, server/npm package manager, server/src/packages/objects-maker/package.json, server/src/packages/objects-maker/npm package manager, server/src/packages/textures_maker/package.json, server/src/packages/textures_maker/npm package manager.
  Package managers: npm (client, server, launcher, objects-maker, textures_maker), composer (api).
  Primary test command: cd api && ./vendor/bin/phpunit.
  NOTE (verified 2026-08-17): server/src/packages/objects-maker's "npm test" script is literally
  "node index.js" (identical to its "start" script) and server/src/packages/textures_maker has no
  real "test" script either (npm default placeholder that exits 1). Neither is a test runner; both
  are one-off asset-generation tools and must never be used as the strict_tdd gate. They have been
  removed from the unit test commands below.
  As of 2026-08-17, client/ (client/package.json: dev, build, preview, jsonmin, jsonunmin only) and
  server/ (server/package.json: start, dev only) have NO test runner at all. This is a real gap, not
  an undetected one. The in-flight change `avatar-color-accessory-system` explicitly scopes adding a
  test runner for client/ (vitest, matching its Vite 6 toolchain) as one of its tasks.
  Unit tests: real runner only for api/ (cd api && ./vendor/bin/phpunit, api/tests/ present); client/
  and server/ intentionally left empty pending the above task.
  Integration tests: none.
  E2E tests: none.
rules:
  proposal:
    require_problem_statement: true
  spec:
    require_acceptance_criteria: true
  design:
    require_tradeoffs: true
  tasks:
    protect_review_workload: true
  apply:
    test_command: "cd api && ./vendor/bin/phpunit"
  verify:
    test_command: "cd api && ./vendor/bin/phpunit"
testing:
  detected: "2026-08-17"
  runner:
    command: "cd api && ./vendor/bin/phpunit"
    framework: "phpunit"
  layers:
    unit: "phpunit (api only); client and server have no test runner as of 2026-08-17"
    integration: ""
    e2e: ""
  commands:
    unit:
      - scope: "api"
        command: "cd api && ./vendor/bin/phpunit"
        framework: "phpunit"
      - scope: "client"
        command: ""
        framework: "none (no test runner as of 2026-08-17; adding vitest is scoped in avatar-color-accessory-system)"
      - scope: "server"
        command: ""
        framework: "none (no test runner as of 2026-08-17)"
    integration:
      []
    e2e:
      []
  coverage:
    command: ""
    commands:
      []
quality:
  lint: ""
  lint_commands:
    []
  typecheck: ""
  typecheck_commands:
    []
  format: "cd api && ./vendor/bin/pint"
  format_commands:
    - scope: "api"
      command: "cd api && ./vendor/bin/pint"
