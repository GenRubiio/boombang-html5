strict_tdd: true
context: |
  client is a Node.js/TypeScript ESM, Vue, Node.js/TypeScript project.
  Detected markers: client/package.json, client/npm package manager, launcher/package.json, launcher/npm package manager, server/package.json, server/npm package manager, server/src/packages/objects-maker/package.json, server/src/packages/objects-maker/npm package manager, server/src/packages/textures_maker/package.json, server/src/packages/textures_maker/npm package manager.
  Package managers: npm (client, server, launcher, objects-maker, textures_maker), composer (api).
  Primary test command: cd api && ./vendor/bin/phpunit.
  NOTE (verified 2026-08-17): server/src/packages/objects-maker's "npm test" script is literally
  "node index.js" (identical to its "start" script) and server/src/packages/textures_maker has no
  real "test" script either (npm default placeholder that exits 1). Neither is a test runner; both
  are one-off asset-generation tools and must never be used as the strict_tdd gate. They have been
  removed from the unit test commands below.
  UPDATED (verified 2026-08-17, avatar-system-multichar-fixes PR1): client/package.json:12 and
  server/package.json:20 each declare a real "test": "vitest run" script (vitest 3.2.7), with
  passing suites already checked in (client: src/**/*.test.js and scripts/**/*.test.cjs, 19 files,
  195 tests; server: src/**/*.test.js, 3 files, 13 tests). The earlier "no test runner at all" note
  for client/server is stale and has been removed. client also adds
  "test:e2e": "playwright test" once the Playwright resolved-state harness lands
  (avatar-system-multichar-fixes PR2) — see specs/avatar-layered-rendering and
  specs/avatar-accessories for the requirements it gates.
  Unit tests: real runners for api/ (cd api && ./vendor/bin/phpunit, api/tests/ present), client/
  (cd client && npm run test, vitest) and server/ (cd server && npm run test, vitest).
  Integration tests: none.
  E2E tests: client/ adds one, cd client && npm run test:e2e (Playwright), from
  avatar-system-multichar-fixes PR2 onward.
rules:
  proposal:
    require_problem_statement: true
  spec:
    require_acceptance_criteria: true
  design:
    require_tradeoffs: true
  tasks:
    protect_review_workload: true
  apply:
    test_command: "cd client && npm run test"
  verify:
    test_command: "cd client && npm run test"
testing:
  detected: "2026-08-17"
  runner:
    command: "cd client && npm run test"
    framework: "vitest"
  layers:
    unit: "vitest (client, server), phpunit (api)"
    integration: ""
    e2e: "playwright (client, from avatar-system-multichar-fixes PR2 onward)"
  commands:
    unit:
      - scope: "api"
        command: "cd api && ./vendor/bin/phpunit"
        framework: "phpunit"
      - scope: "client"
        command: "cd client && npm run test"
        framework: "vitest"
      - scope: "server"
        command: "cd server && npm run test"
        framework: "vitest"
    integration:
      []
    e2e:
      - scope: "client"
        command: "cd client && npm run test:e2e"
        framework: "playwright"
  coverage:
    command: ""
    commands:
      []
quality:
  lint: ""
  lint_commands:
    []
  typecheck: ""
  typecheck_commands:
    []
  format: "cd api && ./vendor/bin/pint"
  format_commands:
    - scope: "api"
      command: "cd api && ./vendor/bin/pint"
